<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Leo Wang</title>
  <desc id="desc">Where precision becomes instinct. A geometric system made of precise luminous threads.</desc>

  <defs>
    <style>
      .halo {
        animation: halo-breathe 6s ease-in-out infinite;
      }
      .warp-lines {
        animation: warp-breathe 7s ease-in-out infinite;
      }
      .flow {
        stroke-dasharray: 34 420;
        animation: thread-flow 8s linear infinite;
      }
      .flow-reverse {
        animation-direction: reverse;
        animation-duration: 10s;
      }
      .flow-delay-1 { animation-delay: -2.4s; }
      .flow-delay-2 { animation-delay: -4.8s; }
      .core-dot {
        animation: core-pulse 3.6s ease-in-out infinite;
      }
      .signal-dot {
        animation: signal-pulse 4.8s ease-in-out infinite;
      }
      .signal-delay-1 { animation-delay: -1.2s; }
      .signal-delay-2 { animation-delay: -2.4s; }
      .signal-delay-3 { animation-delay: -3.6s; }
      .tagline-sweep {
        animation: tagline-sweep 8s ease-in-out 1.8s infinite;
      }

      @keyframes thread-flow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -454; }
      }
      @keyframes halo-breathe {
        0%, 100% { opacity: 0.72; }
        50% { opacity: 1; }
      }
      @keyframes warp-breathe {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 0.34; }
      }
      @keyframes core-pulse {
        0%, 100% { opacity: 0.72; }
        50% { opacity: 1; }
      }
      @keyframes signal-pulse {
        0%, 100% { opacity: 0.28; }
        50% { opacity: 0.92; }
      }
      @keyframes tagline-sweep {
        0%, 12% { opacity: 0; transform: translateX(0); }
        18% { opacity: 0.8; }
        42% { opacity: 0; transform: translateX(1320px); }
        100% { opacity: 0; transform: translateX(1320px); }
      }

      @media (prefers-reduced-motion: reduce) {
        .halo,
        .warp-lines,
        .flow,
        .core-dot,
        .signal-dot,
        .tagline-sweep {
          animation: none;
        }
      }
    </style>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080a10" />
      <stop offset="0.55" stop-color="#0d111b" />
      <stop offset="1" stop-color="#101522" />
    </linearGradient>
    <linearGradient id="threadCool" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d5dfc" stop-opacity="0" />
      <stop offset="0.32" stop-color="#8174ff" />
      <stop offset="0.72" stop-color="#55c7ff" />
      <stop offset="1" stop-color="#55c7ff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="threadWarm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1b45b" stop-opacity="0" />
      <stop offset="0.35" stop-color="#f1b45b" />
      <stop offset="0.75" stop-color="#db7adf" />
      <stop offset="1" stop-color="#db7adf" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7969ff" stop-opacity="0.16" />
      <stop offset="1" stop-color="#7969ff" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b9c2d0" stroke-opacity="0.045" stroke-width="1" />
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="frameClip">
      <rect x="1" y="1" width="1198" height="358" rx="24" />
    </clipPath>
    <clipPath id="taglineClip">
      <text x="76" y="207" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="19" font-weight="450" letter-spacing="2.1">WHERE PRECISION BECOMES INSTINCT.</text>
    </clipPath>
    <linearGradient id="taglineLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.88" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect width="1200" height="360" fill="url(#background)" />
    <rect width="1200" height="360" fill="url(#grid)" />
    <circle class="halo" cx="930" cy="180" r="270" fill="url(#halo)" />

    <g class="warp-lines" opacity="0.28" stroke="#c6ceda" stroke-width="1">
      <path d="M760 54V306" />
      <path d="M804 40V320" />
      <path d="M848 32V328" />
      <path d="M892 28V332" />
      <path d="M936 28V332" />
      <path d="M980 32V328" />
      <path d="M1024 40V320" />
      <path d="M1068 54V306" />
    </g>

    <g fill="none" stroke-linecap="round" filter="url(#glow)">
      <path d="M690 98C770 98 797 141 858 141S949 98 1135 98" stroke="url(#threadCool)" stroke-width="2" />
      <path d="M690 126C778 126 802 161 870 161S968 126 1135 126" stroke="url(#threadWarm)" stroke-width="1.6" />
      <path d="M690 154C780 154 815 178 884 178S975 154 1135 154" stroke="url(#threadCool)" stroke-width="1.4" />
      <path d="M690 180H1135" stroke="url(#threadWarm)" stroke-width="2.2" />
      <path d="M690 206C780 206 815 182 884 182S975 206 1135 206" stroke="url(#threadCool)" stroke-width="1.4" />
      <path d="M690 234C778 234 802 199 870 199S968 234 1135 234" stroke="url(#threadWarm)" stroke-width="1.6" />
      <path d="M690 262C770 262 797 219 858 219S949 262 1135 262" stroke="url(#threadCool)" stroke-width="2" />
    </g>

    <g fill="none" stroke-linecap="round" filter="url(#glow)" opacity="0.9">
      <path class="flow" d="M690 98C770 98 797 141 858 141S949 98 1135 98" stroke="#9187ff" stroke-width="2.6" />
      <path class="flow flow-reverse flow-delay-1" d="M690 126C778 126 802 161 870 161S968 126 1135 126" stroke="#f1b45b" stroke-width="2.2" />
      <path class="flow flow-delay-2" d="M690 154C780 154 815 178 884 178S975 154 1135 154" stroke="#64ccff" stroke-width="2" />
      <path class="flow flow-reverse" d="M690 180H1135" stroke="#df82dc" stroke-width="2.8" />
      <path class="flow flow-delay-1" d="M690 206C780 206 815 182 884 182S975 206 1135 206" stroke="#64ccff" stroke-width="2" />
      <path class="flow flow-reverse flow-delay-2" d="M690 234C778 234 802 199 870 199S968 234 1135 234" stroke="#f1b45b" stroke-width="2.2" />
      <path class="flow" d="M690 262C770 262 797 219 858 219S949 262 1135 262" stroke="#9187ff" stroke-width="2.6" />
    </g>

    <g transform="translate(914 180) rotate(45)" fill="#0d111b" stroke="#d9deea">
      <rect x="-34" y="-34" width="68" height="68" stroke-opacity="0.72" stroke-width="1.2" />
      <rect x="-19" y="-19" width="38" height="38" stroke="#8f83ff" stroke-width="1.5" />
      <circle class="core-dot" cx="0" cy="0" r="4" fill="#f4f1ff" stroke="none" filter="url(#glow)" />
    </g>

    <g fill="#dfe5ef">
      <circle class="signal-dot" cx="804" cy="126" r="2.6" />
      <circle class="signal-dot signal-delay-1" cx="848" cy="206" r="2.6" />
      <circle class="signal-dot signal-delay-2" cx="980" cy="154" r="2.6" />
      <circle class="signal-dot signal-delay-3" cx="1024" cy="234" r="2.6" />
    </g>

    <text x="74" y="66" fill="#8792a5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2.6">// DUBIANCHE123</text>
    <text x="72" y="159" fill="#f2f4f8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="62" font-weight="650" letter-spacing="-1.8">LEO WANG</text>
    <text class="tagline" x="76" y="207" fill="#c5ccd8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="19" font-weight="450" letter-spacing="2.1">WHERE PRECISION BECOMES INSTINCT.</text>
    <rect class="tagline-sweep" x="-280" y="180" width="240" height="38" fill="url(#taglineLight)" clip-path="url(#taglineClip)" />
    <text class="scope-line" x="76" y="270" fill="#727e91" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.7">AGENT RUNTIMES  /  CONTEXT SYSTEMS  /  CLOUD + EDGE</text>
  </g>

  <rect x="1" y="1" width="1198" height="358" rx="24" fill="none" stroke="#30394a" stroke-width="2" />
</svg>
